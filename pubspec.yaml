name: shareme
description: 'ShareMe — Close-range high-speed file transfer'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Immutable State / Code Gen ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Navigation ---
  go_router: ^14.8.1

  # --- Database (SQLite) ---
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # --- Functional Programming (Result/Either type) ---
  fpdart: ^1.1.0

  # --- Utilities ---
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  logger: ^2.5.0
  permission_handler: ^11.3.1
  intl: ^0.19.0

  # --- Icons (Material Symbols) ---
  material_symbols_icons: ^4.2796.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Linting ---
  flutter_lints: ^5.0.0

  # --- Code Generation ---
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.22.1

  # --- Testing ---
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Assets will be added as needed in later milestones
  # assets:
  #   - assets/icons/
  #   - assets/images/
